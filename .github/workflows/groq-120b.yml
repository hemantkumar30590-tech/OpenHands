name: Groq 120B - FINAL WORKING
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Kya banana hai?'
        required: true
        default: 'Create a beautiful todo app with HTML CSS JS'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run OpenHands
        run: |
          docker run --rm --privileged --network=host \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v $(pwd):/opt/workspace \
          -e WORKSPACE_MOUNT_PATH=/opt/workspace \
          -e SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:latest \
          -e LLM_MODEL=openai/gpt-oss-120b \
          -e LLM_BASE_URL=https://api.groq.com/openai/v1 \
          -e LLM_API_KEY=${{ secrets.LLM_API_KEY }} \
          ghcr.io/all-hands-ai/openhands:latest \
          python -m openhands.core.main --task "${{ inputs.task }}"
      - name: Push code
        run: |
          git config user.name "OpenHands"
          git config user.email "bot@openhands.dev"
          git add .
          git commit -m "AI: ${{ inputs.task }}" || true
          git push
