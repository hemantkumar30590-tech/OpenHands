stages:
  - run

OpenHands-Mobile:
  stage: run
  image: docker:20.10
  services:
    - docker:20.10-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "Mobile se OpenHands start ho raha hai..."
    - docker run --rm ghcr.io/all-hands-ai/openhands:latest --help
  rules:
    - when: manual
