```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Powerful Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <!-- Row 1 -->
            <button class="func" data-value="sin(">sin</button>
            <button class="func" data-value="cos(">cos</button>
            <button class="func" data-value="tan(">tan</button>
            <button class="func" data-value="log10(">log</button>
            <button class="func" data-value="ln(">ln</button>
            <button class="op" data-value="^">^</button>
            <button class="op" data-value="(">(</button>
            <button class="op" data-value=")">)</button>
            <button class="op" data-value="C">C</button>
            <button class="op" data-value="←">←</button>

            <!-- Row 2 -->
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="op" data-value="/">&divide;</button>
            <button class="func" data-value="sqrt(">√</button>
            <button class="func" data-value="factorial(">x!</button>
            <button class="func" data-value="exp(">e^x</button>
            <button class="func" data-value="pow10(">10^x</button>
            <button class="op" data-value="%">%</button>
            <button class="op" data-value="π">π</button>

            <!-- Row 3 -->
            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="op" data-value="*">&times;</button>
            <button class="func" data-value="asin(">asin</button>
            <button class="func" data-value="acos(">acos</button>
            <button class="func" data-value="atan(">atan</button>
            <button class="func" data-value="sinh(">sinh</button>
            <button class="func" data-value="cosh(">cosh</button>
            <button class="func" data-value="tanh(">tanh</button>

            <!-- Row 4 -->
            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="op" data-value="-">-</button>
            <button class="func" data-value="abs(">abs</button>
            <button class="func" data-value="ceil(">⌈⌉</button>
            <button class="func" data-value="floor(">⌊⌋</button>
            <button class="func" data-value="round(">round</button>
            <button class="func" data-value="deg(">deg</button>
            <button class="func" data-value="rad(">rad</button>

            <!-- Row 5 -->
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="op" data-value="+">+</button>
            <button class="equals" id="equals">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
