```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <div class="display" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn func" data-action="clear" aria-label="Clear">C</button>
      <button class="btn func" data-action="delete" aria-label="Delete">⌫</button>
      <button class="btn func" data-action="percent" aria-label="Percent">%</button>
      <button class="btn op" data-action="operator" data-value="/" aria-label="Divide">÷</button>

      <!-- Row 2 -->
      <button class="btn num" data-action="digit" data-value="7">7</button>
      <button class="btn num" data-action="digit" data-value="8">8</button>
      <button class="btn num" data-action="digit" data-value="9">9</button>
      <button class="btn op" data-action="operator" data-value="*" aria-label="Multiply">×</button>

      <!-- Row 3 -->
      <button class="btn num" data-action="digit" data-value="4">4</button>
      <button class="btn num" data-action="digit" data-value="5">5</button>
      <button class="btn num" data-action="digit" data-value="6">6</button>
      <button class="btn op" data-action="operator" data-value="-" aria-label="Minus">‑</button>

      <!-- Row 4 -->
      <button class="btn num" data-action="digit" data-value="1">1</button>
      <button class="btn num" data-action="digit" data-value="2">2</button>
      <button class="btn num" data-action="digit" data-value="3">3</button>
      <button class="btn op" data-action="operator" data-value="+" aria-label="Plus">+</button>

      <!-- Row 5 -->
      <button class="btn num zero" data-action="digit" data-value="0">0</button>
      <button class="btn num" data-action="decimal" data-value=".">.</button>
      <button class="btn eq" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
```
